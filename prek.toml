# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

default_stages = ["pre-commit"]

# prek 組み込みフック (オフラインで動作する Rust ネイティブ実装)
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  # マージコンフリクトマーカーが残ったコミットを防ぐ
  { id = "check-merge-conflict" },
  # 秘密鍵の誤コミットを防ぐ
  { id = "detect-private-key" },
]

# tombi: TOML のフォーマッタ・リンタ
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/tombi-toml/tombi-pre-commit"
rev = "v1.5.2"
hooks = [
  # 自動生成される lock ファイルは tombi の対象外にする
  { id = "tombi-lint", exclude = { glob = ["uv.lock", "Cargo.lock"] } },
  { id = "tombi-format", exclude = { glob = ["uv.lock", "Cargo.lock"] } },
]

# astral-sh/ruff-pre-commit: ruff の公式フック
# rev は prek auto-update で更新する
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.16.6"

# ruff format: フォーマッタ
[[repos.hooks]]
id = "ruff-format"
priority = 0

# ruff check: リンタ
[[repos.hooks]]
id = "ruff-check"
priority = 10

# astral-sh/ty-pre-commit: ty の公式フック
# rev は ty 本体のバージョンに対応する
# --isolated で uv.lock / .venv を変更せずに実行する
[[repos]]
repo = "https://github.com/astral-sh/ty-pre-commit"
rev = "v0.0.78"
hooks = [
  { id = "ty", args = ["--isolated"], priority = 20 },
]

# プロジェクト固有のローカルフック
# priority が小さいほど先に実行される。同じ priority なら並列実行される
[[repos]]
repo = "local"

# cargo fmt: Rust のフォーマッタ
[[repos.hooks]]
id = "cargo-fmt"
name = "cargo fmt"
entry = "cargo fmt --all"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 0

# cargo clippy: Rust のリンタ
[[repos.hooks]]
id = "cargo-clippy"
name = "cargo clippy"
entry = "cargo clippy --all-targets -- -D warnings"
language = "system"
types = ["rust"]
pass_filenames = false
priority = 10

# pytest: ユニットテスト
[[repos.hooks]]
id = "pytest"
name = "pytest"
entry = "uv run pytest"
language = "system"
pass_filenames = false
priority = 30
